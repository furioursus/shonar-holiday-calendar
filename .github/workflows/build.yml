name: Scrape and publish calendar

on:
  schedule:
    # Mondays 09:17 UTC
    - cron: "17 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scraper/requirements.txt

      - name: Scrape nationaltoday.com
        run: python -u scraper/scrape.py

      - name: Commit scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update scraped holiday data"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build .ics feeds
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python scraper/build_ics.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
